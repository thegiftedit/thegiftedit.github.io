<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Gift Edit</title>
<meta name="description" content="Simple, practical gift guides.">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#22301f;--muted:#5d6858;--green:#2f5d3a;--accent:#c7652a;--line:#e3ddd0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.hero{padding:64px 0 32px;text-align:center}
h1{font-family:Fraunces,Georgia,serif;font-weight:650;font-size:clamp(36px,7vw,56px);margin:0 0 10px}
.hero p{color:var(--muted);font-size:18px;margin:0}
.list{display:grid;gap:14px;padding-bottom:56px}
.list a{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;text-decoration:none;color:var(--ink)}
.list a:hover{border-color:var(--green)}
.list .k{color:var(--accent);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.list h2{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:24px;margin:2px 0 4px}
.list p{color:var(--muted);margin:0}
footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:14px;text-align:center}
</style></head><body>
<main class="wrap">
<section class="hero"><h1>The Gift Edit</h1><p>Simple, practical gift guides.</p></section>
<section class="list">
<a href="gardeners/"><span class="k">Gift Guide</span><h2>Gifts for Gardeners</h2><p>Six practical picks for pruning, potting, planting and fall clean-up.</p></a>
</section></main>
<footer><div class="wrap">As an Amazon Associate I earn from qualifying purchases.</div></footer>
</body></html>
